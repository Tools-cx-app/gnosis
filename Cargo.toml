[workspace]
members = [
    "crates/gnosis-cli",
    "crates/gnosis-config",
    "crates/gnosis-helper",
    "crates/gnosis-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
bitflags = "2.9"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
gnosis-helper = { path = "crates/gnosis-helper" }
libc = "0.2"
procfs = { version = "0.18", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
toml = "0.9"
uuid = { version = "1.17", features = ["v4", "serde"] }
which = "8.0.5"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
