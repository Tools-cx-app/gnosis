version: 2
updates:
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    commit-message:
      # Prefix all commit messages with "deps(cargo): "
      prefix: "deps(cargo)"
    groups:
      crates:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Prefix all commit messages with "deps(action): "
      prefix: "deps(action)"
    groups:
      actions:
        patterns:
          - "*"
