name: CI

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "src/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
          - abi: x86
            target: i686-linux-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}

      - name: Build
        run: cargo ndk --platform 21 --target ${{ matrix.abi }} build --workspace --release --locked

      - name: Package artifact
        run: tar -C target/${{ matrix.target }}/release -czf gnosis-android-${{ matrix.abi }}.tar.gz gnosis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnosis-android-${{ matrix.abi }}
          path: gnosis-android-${{ matrix.abi }}.tar.gz
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install AArch64 linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}

      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Package artifact
        run: tar -C target/${{ matrix.target }}/release -czf gnosis-linux-${{ matrix.target }}.tar.gz gnosis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnosis-linux-${{ matrix.target }}
          path: gnosis-linux-${{ matrix.target }}.tar.gz
          if-no-files-found: error
